name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x ./gradlew
      - run: ./gradlew spotlessApply
      - run: ./gradlew build dokkaGenerate -Penv=release

      - name: Zip Dokka output
        run: |
          find build/dokka/gfm -name '*.md' 2>/dev/null | grep -q . || { echo "No Markdown output in build/dokka/gfm:"; ls -R build/dokka || true; exit 1; }
          cd build/dokka/gfm
          zip -r ../../dokka-gfm.zip .

      - run: ./gradlew uploadArtifacts -Penv=release
        env:
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            build/libs/*-sources.jar
            build/libs/!(*-@(sources)).jar
            build/dokka-gfm.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}