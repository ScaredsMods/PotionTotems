name: dev-build

on:
  workflow_dispatch:
  push:
    branches: [26.1]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x ./gradlew
      - run: ./gradlew spotlessApply
      - run: ./gradlew build dokkaGenerate -Penv=dev -PdevVersion=${{ github.run_number }}

      - name: Zip Dokka output
        run: |
          find build/dokka/gfm -name '*.md' 2>/dev/null | grep -q . || { echo "No Markdown output in build/dokka/gfm:"; ls -R build/dokka || true; exit 1; }
          cd build/dokka/gfm
          zip -r ../../dokka-gfm.zip .

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: "dev-${{ github.run_number }}"
          files: |
            build/libs/*.jar
            build/dokka-gfm.zip
          generate_release_notes: false
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}