name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew spotlessApply
      - run: chmod +x ./gradlew
      - run: ./gradlew spotlessApply
      - run: ./gradlew build -Penv=dev